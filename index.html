<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8ee;--dim:#9aa3b2;--accent:#6aa8ff;--line:#252a34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 20px 64px}
h1{margin:0 0 6px;font-size:24px}
.sub{color:var(--dim);font-size:14px;margin-bottom:26px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
       padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit;transition:border-color .15s}
a.card:hover{border-color:var(--accent)}
.t{font-size:17px;font-weight:600;margin-bottom:4px}
.d{color:var(--dim);font-size:13px}
.tag{display:inline-block;font-size:12px;color:var(--dim);border:1px solid var(--line);
     border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle}
footer{color:var(--dim);font-size:12px;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
</style>
