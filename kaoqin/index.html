<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="考勤与工资计算器（公开示例版，不含任何个人数据）">
<title>考勤助手 · 手机版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d3b34'/%3E%3Crect x='13' y='15' width='38' height='34' rx='6' fill='none' stroke='%236ee7b7' stroke-width='4'/%3E%3Cpath d='M13 27h38M21 9v12M43 9v12' stroke='%236ee7b7' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='38' r='3' fill='%23fbbf24'/%3E%3Ccircle cx='33' cy='38' r='3' fill='%2360a5fa'/%3E%3Ccircle cx='42' cy='38' r='3' fill='%23f0fdfa'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef2ef;
  --paper:#f5f8f6;
  --card:#ffffff;
  --ink:#16241f;
  --muted:#5e7066;
  --faint:#93a39a;
  --brand:#0d9488;
  --brand-2:#14b8a6;
  --brand-deep:#0b5d52;
  --brand-dark:#0a3d36;
  --brand-soft:#e0f2ec;
  --brand-faint:#f0faf6;
  --line:rgba(13,148,136,.10);
  --line-soft:rgba(13,148,136,.06);
  --shadow-sm:0 1px 2px rgba(14,42,34,.05);
  --shadow-md:0 2px 6px rgba(14,42,34,.06), 0 10px 28px -14px rgba(14,42,34,.16);
  --ban:#0ea371; --ban-soft:#d9f5e8;
  --xiu:#d97706; --xiu-soft:#fdeed2;
  --fang:#3b82f6; --fang-soft:#dbe8fe;
  --jia:#8b5cf6; --jia-soft:#ebe3fe;
  --chi:#e11d48; --chi-soft:#fde3e9;
  --empty:#c9d4ce;
  --ed:#e07b00;
  --ok:#0ea371;
  --radius:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);
  background-image:repeating-linear-gradient(0deg, rgba(13,148,136,.025) 0 1px, transparent 1px 26px);
  color:var(--ink); font-size:15px; line-height:1.55;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
::selection{background:var(--brand-soft);}
.cloud-state{font-size:11px; color:#9aa7a2; background:rgba(255,255,255,.10); padding:3px 9px; border-radius:99px; white-space:nowrap; letter-spacing:.2px; transition:color .3s;}
/* ===== 顶部 ===== */
header{
  position:sticky; top:0; z-index:20; overflow:hidden;
  background:
    radial-gradient(ellipse 120% 90% at 12% -20%, rgba(110,231,183,.16), transparent 55%),
    radial-gradient(ellipse 100% 80% at 105% 8%, rgba(20,184,166,.20), transparent 50%),
    linear-gradient(135deg,#0a3d36 0%,#0c5a4e 52%,#0e7768 100%);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 16px;
  border-bottom:1px solid rgba(110,231,183,.18);
}
header::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
  background:linear-gradient(90deg,transparent,rgba(110,231,183,.55),transparent);
}
.hd-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.hd-left{display:flex; align-items:baseline; gap:10px; min-width:0;}
.app-name{font-size:20px; font-weight:800; letter-spacing:.6px; display:flex; align-items:center; gap:8px; white-space:nowrap;}
.app-name svg{width:23px; height:23px; flex:none; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
.app-sub{font-size:12px; opacity:.82; white-space:nowrap; font-weight:500;}
.hd-right{display:flex; align-items:center; gap:8px; flex:none;}
.manage-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center;
  cursor:pointer; padding:0; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:transform .12s ease, background .12s ease;
}
.manage-btn:active{transform:scale(.94); background:rgba(255,255,255,.24);}
.person-switch{
  display:flex; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16);
  border-radius:14px; padding:4px; gap:4px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.person-switch button{
  flex:1; border:none; background:transparent; color:#cfeae2; font-size:15px; font-weight:700;
  padding:9px 0; border-radius:10px; cursor:pointer; min-height:44px; letter-spacing:.5px;
  transition:all .16s ease;
}
.person-switch button.on{
  background:#fff; color:var(--brand-deep); box-shadow:0 3px 10px -2px rgba(0,0,0,.25);
}
.person-manage{
  margin-top:8px; width:100%; border:none; background:rgba(255,255,255,.12);
  border:1px dashed rgba(255,255,255,.35); color:#e8fff7; font-size:13px; font-weight:600;
  padding:8px 0; border-radius:11px; cursor:pointer; min-height:38px; letter-spacing:.5px; transition:all .16s ease;
}
.person-manage:active{transform:scale(.97); background:rgba(255,255,255,.22);}
.prow{display:flex; align-items:center; gap:8px; margin:8px 0;}
.prow .pname{flex:1.6; min-width:0;}
.prow .pbase{flex:1; min-width:0;}
.prow .x{flex:none; width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--chi-soft); color:var(--chi); font-size:13px; cursor:pointer;}
.prow input{width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:14px; background:#fff; color:var(--ink);}
.conv{background:#f7fbf9; border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
.conv-row{display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
.conv-row input{width:52px; box-sizing:border-box; border:1px solid var(--line); border-radius:8px; padding:6px 4px; font-size:13px; text-align:center; background:#fff; color:var(--ink); font-variant-numeric:tabular-nums;}
.conv-row span{font-size:11px; color:var(--muted); margin-right:3px;}
.conv-out{margin-top:6px; font-size:12.5px; color:var(--ink);}
.conv-out b{font-size:20px; color:var(--brand-deep); font-variant-numeric:tabular-nums;}
.person-switch button .pbase{display:block; font-size:11px; font-weight:500; opacity:.72; margin-top:1px;}
.person-switch button.on .pbase{opacity:.68;}
main{max-width:560px; margin:0 auto; padding:14px 14px 20px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:14px; box-shadow:var(--shadow-sm);
}
.card h3{
  margin:0 0 12px; font-size:13px; color:var(--muted); font-weight:700; letter-spacing:.4px;
  display:flex; align-items:center; gap:6px;
}
.card h3 .tag{
  font-size:11px; font-weight:600; color:#b45309; background:var(--xiu-soft);
  border-radius:20px; padding:2px 9px; margin-left:2px;
}
/* ===== 月份/年份导航 ===== */
.mnav{display:flex; align-items:center; gap:10px;}
.mnav .navbtn{
  width:44px; height:44px; flex:none; border-radius:13px; border:1px solid var(--line);
  background:#fff; color:var(--brand); display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:var(--shadow-sm); transition:transform .12s ease, background .12s ease;
}
.mnav .navbtn:active{transform:scale(.93); background:var(--brand-faint);}
.mnav .mcenter{flex:1; text-align:center; min-width:0;}
.mnav .mcenter .mt{font-size:19px; font-weight:800; letter-spacing:.5px; display:flex; align-items:center; justify-content:center; gap:6px;}
.mnav .mcenter .ms{font-size:12px; color:var(--muted); margin-top:2px; font-weight:500;}
.mnav .mcenter .mt .cal-edit{
  border:none; background:var(--brand-faint); color:var(--brand-deep); font-size:12px; font-weight:700;
  border-radius:20px; padding:3px 10px; cursor:pointer; border:1px solid var(--line);
}
.mnav .mcenter .mt .cal-edit:active{background:var(--brand-soft);}
/* ===== 日历 ===== */
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:13px; font-weight:500;}
.legend span{display:flex; align-items:center; gap:5px;}
.legend i{display:inline-block; width:9px; height:9px; border-radius:3px; flex:none;}
.weekrow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin:4px 0 8px;}
.weekrow span{text-align:center; font-size:11px; color:var(--faint); font-weight:700; letter-spacing:.5px; padding:3px 0;}
.cal-card{padding:8px 6px 10px;}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:4px 0 8px;}
.day{
  position:relative; aspect-ratio:1/1; border-radius:12px; border:1px solid var(--line-soft);
  background:var(--paper); padding:5px 5px 6px; display:flex; flex-direction:column; gap:3px;
  cursor:pointer; overflow:hidden; transition:transform .1s ease;
}
.day:active{transform:scale(.92);}
.day.today{
  border-color:var(--brand); background:linear-gradient(180deg,#eafaf4,#f4fcf9);
  box-shadow:0 0 0 1px var(--brand) inset, var(--shadow-sm);
}
.day.today .dnum{color:var(--brand-deep);}
.day.edited{outline:1.5px solid var(--ed); outline-offset:1px;}
.day .eddot{position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%; background:var(--ed); box-shadow:0 0 0 2px #fff;}
.day.blank{background:transparent; border-color:transparent; cursor:default;}
.day .dnum{font-size:12px; font-weight:800; color:var(--ink); line-height:1.15; display:flex; align-items:center; gap:3px;}
.day .dnum .otdot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--jia); box-shadow:0 0 0 2px var(--jia-soft);}
.day .bars{display:flex; flex-direction:column; gap:3px; margin-top:auto;}
.bar{height:6px; border-radius:3px; background:repeating-linear-gradient(90deg, var(--empty) 0 3px, transparent 3px 5px); opacity:.7;}
.bar.s1{background:linear-gradient(180deg,rgba(255,255,255,.45),transparent), var(--ban); opacity:1; box-shadow:0 1px 1px rgba(14,163,113,.28);}
.bar.s2{background:linear-gradient(180deg,rgba(255,255,255,.4),transparent), var(--xiu); opacity:1; box-shadow:0 1px 1px rgba(217,119,6,.26);}
.bar.s3{background:linear-gradient(180deg,rgba(255,255,255,.4),transparent), var(--fang); opacity:1; box-shadow:0 1px 1px rgba(59,130,246,.25);}
.bar.s4{background:linear-gradient(180deg,rgba(255,255,255,.4),transparent), var(--jia); opacity:1; box-shadow:0 1px 1px rgba(139,92,246,.25);}
.bar.s5{background:linear-gradient(180deg,rgba(255,255,255,.4),transparent), var(--chi); opacity:1; box-shadow:0 1px 1px rgba(225,29,72,.24);}
/* ===== 统计 ===== */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.stat{
  position:relative; padding:9px 10px 8px; border:1px solid var(--line-soft); border-radius:10px;
  background:#fbfcfb; overflow:hidden;
}
.stat::before{content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0;}
.stat.ban::before{background:var(--ban);}
.stat.xiu::before{background:var(--xiu);}
.stat.fang::before{background:var(--fang);}
.stat.jia::before{background:var(--jia);}
.stat .ic{width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:4px;}
.stat.ban .ic{background:var(--ban-soft); color:var(--ban);}
.stat.xiu .ic{background:var(--xiu-soft); color:var(--xiu);}
.stat.fang .ic{background:var(--fang-soft); color:var(--fang);}
.stat.jia .ic{background:var(--jia-soft); color:var(--jia);}
.stat .num{font-size:19px; font-weight:800; line-height:1.15; letter-spacing:-.2px; font-variant-numeric:tabular-nums;}
.stat .num small{font-size:12px; font-weight:600; color:var(--muted); margin-left:2px;}
.stat .t{font-size:12px; color:var(--muted); margin-top:3px; font-weight:500;}
/* ===== 工资明细 ===== */
.kv{display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-bottom:1px dashed rgba(13,148,136,.14); font-size:14px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted); display:flex; align-items:center; gap:6px;}
.kv .v{font-weight:700; font-variant-numeric:tabular-nums;}
.kv.neg .v{color:var(--chi);}
.kv .v.pos{color:var(--ok);}
.kv .sub{font-size:11.5px; color:var(--faint); font-weight:500; display:block; margin-top:1px;}
.salary-total{
  margin-top:12px; padding:13px 14px; border-radius:13px;
  background:linear-gradient(135deg,var(--brand-faint),var(--brand-soft));
  border:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
}
.salary-total .k{font-size:13px; color:var(--brand-deep); font-weight:700;}
.salary-total .v{font-size:21px; font-weight:800; color:var(--brand-deep); font-variant-numeric:tabular-nums;}
.edit-salary{
  border:none; background:var(--brand-soft); color:var(--brand-deep); width:26px; height:26px;
  border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex:none;
  transition:transform .1s ease;
}
.edit-salary:active{transform:scale(.9);}
.warn{
  background:var(--xiu-soft); color:#92400e; border-radius:12px; padding:10px 12px;
  font-size:13px; margin-top:12px; line-height:1.55;
}
.edit-note{
  display:flex; align-items:flex-start; gap:6px; font-size:11.5px; color:#b45309;
  background:var(--xiu-soft); border-radius:9px; padding:6px 9px; margin-top:8px; line-height:1.5;
}
.edit-note svg{flex:none; margin-top:1px;}
.hint{font-size:12px; color:var(--faint); margin-top:9px; line-height:1.55;}
.rule-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed rgba(13,148,136,.13); font-size:13.5px; line-height:1.6;}
.rule-item:last-child{border-bottom:none;}
.rule-item .rk{flex:none; width:26px; height:26px; border-radius:9px; background:var(--brand-soft); color:var(--brand-deep); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.rule-item .rt b{color:var(--ink);}
.rule-item .rt{color:var(--muted);}
.rule-item .rt .ex{display:block; margin-top:5px; font-size:12px; color:var(--faint); background:var(--brand-faint); border:1px solid var(--line-soft); border-radius:9px; padding:7px 9px;}
/* ===== 备注 ===== */
.note{display:flex; gap:9px; align-items:flex-start; padding:8px 0; border-bottom:1px dashed rgba(13,148,136,.12); font-size:13px;}
.note:last-child{border-bottom:none;}
.note .nd{flex:none; min-width:46px; font-weight:700; color:var(--brand-deep); font-variant-numeric:tabular-nums; font-size:12px; padding-top:1px;}
/* ===== 年度 ===== */
table{width:100%; border-collapse:collapse; table-layout:fixed; font-size:13px;}
th,td{border-bottom:1px solid var(--line-soft); padding:9px 3px; text-align:right; font-variant-numeric:tabular-nums;}
th{color:var(--faint); font-weight:600; font-size:11.5px; letter-spacing:.3px;}
td:first-child,th:first-child{text-align:left; font-weight:600;}
tr:last-child td{border-bottom:none;}
tr.section td{font-weight:800; color:var(--brand-deep); background:var(--brand-faint); border-radius:8px;}
.bars{display:flex; align-items:flex-end; gap:6px; height:160px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; min-width:0;}
.bar-col .fill{
  width:100%; max-width:30px; background:linear-gradient(180deg,var(--brand-2),var(--brand));
  border-radius:5px 5px 2px 2px; min-height:3px;
  box-shadow:0 2px 5px -1px rgba(13,148,136,.35);
  transition:height .3s ease;
}
.bar-col .val{font-size:9.5px; color:var(--muted); white-space:nowrap; font-weight:600; font-variant-numeric:tabular-nums;}
.bar-col .lbl{font-size:10.5px; color:var(--faint); font-weight:600;}
.bar-col.placeholder .fill{
  background:repeating-linear-gradient(135deg,#dfe8e2 0 5px,#eef3ef 5px 10px);
  box-shadow:none;
}
.bar-col.placeholder .val{color:var(--faint);}
/* ===== 欠款 ===== */
.debt{border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:12px; background:#fff; box-shadow:var(--shadow-sm);}
.debt .dh{display:flex; justify-content:space-between; align-items:center; margin-bottom:11px;}
.debt .dh .plat{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px;}
.debt .dh .plat .pico{width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none;}
.debt .dh .plat .pico.zs{background:#fde8ec; color:#e4002b;}
.debt .dh .plat .pico.zfb{background:#e8f1ff; color:#1677ff;}
.debt .dh .badge{font-size:11px; color:#fff; background:var(--brand); border-radius:20px; padding:3px 11px; font-weight:600;}
.debt .big{font-size:26px; font-weight:800; color:var(--chi); font-variant-numeric:tabular-nums; letter-spacing:-.3px;}
.debt .big small{font-size:12px; color:var(--muted); font-weight:500; margin-left:5px;}
.debt .kv{margin-top:2px;}
/* ===== 欠款（可编辑/分期） ===== */
.debt .debt-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-bottom:12px;}
.debt .dg .k{font-size:11px; color:var(--faint); font-weight:600; display:block;}
.debt .dg .v{font-weight:800; font-size:15px; font-variant-numeric:tabular-nums;}
.debt .dg.big{grid-column:1 / -1;}
.debt .dg.big .v{font-size:20px; color:var(--chi);}
.debt-ops{display:flex; gap:8px;}
.debt-ops .op{
  flex:1; border:1px solid var(--line); background:#fff; color:var(--brand-deep);
  border-radius:11px; padding:10px 0; font-size:13px; font-weight:700; cursor:pointer;
  transition:background .12s ease, transform .1s ease;
}
.debt-ops .op:active{transform:scale(.96); background:var(--brand-faint);}
.debt-ops .op.del{color:var(--chi); border-color:#f3c6ce; background:#fdf0f2;}
.debt-ops .op.del:active{background:#fbe3e9;}
.badge.done{background:var(--ban);}
.btn-add{
  width:100%; border:1.5px dashed var(--brand); background:var(--brand-faint); color:var(--brand-deep);
  border-radius:14px; padding:14px 0; font-size:15px; font-weight:800; cursor:pointer; margin-bottom:12px;
  transition:background .12s ease;
}
.btn-add:active{background:var(--brand-soft);}
/* ===== 收益 ===== */
.inc-chart{display:flex; align-items:flex-end; justify-content:space-around; gap:10px; height:178px; padding:10px 6px 0; position:relative;}
.inc-chart::before{content:""; position:absolute; left:8px; right:8px; bottom:26px; border-bottom:1px dashed var(--line);}
.barc{display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; min-width:0;}
.bwrap{display:flex; align-items:flex-end; height:122px;}
.bwrap .b{width:44px; border-radius:9px 9px 4px 4px; transition:height .45s cubic-bezier(.22,.61,.36,1); box-shadow:0 6px 14px rgba(0,0,0,.07);}
.bwrap .b.dep{background:linear-gradient(180deg,#34d399,#0e9f6e);}
.bwrap .b.con{background:linear-gradient(180deg,#fbbf24,#d97706);}
.bwrap .b.rep{background:linear-gradient(180deg,#f87171,#dc2626);}
.bval{font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap;}
.blab{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap;}
.bdot{width:8px; height:8px; border-radius:3px; flex:none;}
.bdot.dep{background:#0e9f6e;} .bdot.con{background:#d97706;} .bdot.rep{background:#dc2626;}
.inc-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
.inc{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:var(--shadow-sm);}
.inc .ih{display:flex; align-items:center; gap:7px; margin-bottom:6px;}
.inc .ih .ico{width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none;}
.inc.dep .ih .ico{background:var(--brand-soft); color:var(--brand-deep);}
.inc.con .ih .ico{background:var(--xiu-soft); color:#b45309;}
.inc.rep .ih .ico{background:var(--chi-soft); color:var(--chi);}
.inc .ih .t{font-size:12px; color:var(--muted); font-weight:600;}
.inc .v{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.2px;}

<script>/* ==== 本地“云端”代理（公开版：不连任何服务器） ====================
  原本 /save 与 /userdata 指向 NAS 上的服务；公开版默认改为读写浏览器本地存储，
  因此每个人的数据都在自己的浏览器里，互不可见，也不会上传。
  需要多设备互通时，点左下角 ⇅ 连接自己的 NAS（独立槽位 kaoqin）。
  注：只拦截这两个路径，页面自身逻辑一行未改。                    */
(function () {
  var KEY = "kaoqin_local_cloud_v1";     /* 本机存储：{v:2, items:{"<uid>":{d,t}}} */
  var KQ_APP = "kaoqin";                 /* 服务端槽位 */
  var KQ_VER = "版本 2026-10-09a · 含 NAS 同步";
  var realFetch = window.fetch ? window.fetch.bind(window) : null;

  /* ---------- 本机存储（按 uid 分开，每个 uid 一份 {d,t}） ---------- */
  function kqNorm(raw) {
    if (!raw || typeof raw !== "object") { return { items: {} }; }
    var out = {}, k;
    if (raw.items && typeof raw.items === "object") {
      for (k in raw.items) {
        var r = raw.items[k];
        if (r && typeof r === "object" && r.d !== undefined) { out[k] = { d: r.d, t: Number(r.t) || 0 }; }
      }
      return { items: out };
    }
    if (typeof raw.uid === "string") {   /* 旧格式（整份就是一个 uid 的数据）自动迁移 */
      out[raw.uid] = { d: raw, t: Number(raw.ts) || 0 };
    }
    return { items: out };
  }
  function kqRead() {
    try { return kqNorm(JSON.parse(localStorage.getItem(KEY) || "null")); }
    catch (e) { return { items: {} }; }
  }
  function kqWrite(store) {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 2, items: (store && store.items) || {} })); return true; }
    catch (e) { return false; }
  }
  function kqUid() {
    try {
      if (typeof UID === "string" && UID) { return UID; }
    } catch (e) {}
    try { return localStorage.getItem("kaoqin_uid") || ""; } catch (e) { return ""; }
  }
  function reply(obj, status) {
    var bodyText = JSON.stringify(obj), code = status || 200;
    if (typeof Response === "function") {
      try {
        return Promise.resolve(new Response(bodyText,
          { status: code, headers: { "Content-Type": "application/json" } }));
      } catch (e) { /* 落到下面的兼容实现 */ }
    }
    /* 兼容老内核（部分安卓 WebView / 微信内置浏览器没有 Response） */
    return Promise.resolve({
      ok: code >= 200 && code < 300, status: code, statusText: "",
      headers: { get: function () { return "application/json"; } },
      json: function () { return Promise.resolve(JSON.parse(bodyText)); },
      text: function () { return Promise.resolve(bodyText); }
    });
  }
  function qs(url, name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(url);
    return m ? decodeURIComponent(m[1]) : "";
  }
  window.fetch = function (input, init) {
    var url = (typeof input === "string") ? input : ((input && input.url) || "");
    var path = url.split("?")[0];
    if (path !== "/save" && path !== "/userdata") {
      return realFetch ? realFetch(input, init) : Promise.reject(new Error("fetch unavailable"));
    }
    init = init || {};
    var method = ((init.method || "GET") + "").toUpperCase();
    if (path === "/userdata" && method === "GET") {
      var uid = qs(url, "uid");
      var db = kqRead(), rec = db.items[uid];
      if (!rec) { return reply({ ok: false, error: "no data for this uid" }); }
      return reply({ ok: true, data: rec.d });
    }
    if (path === "/save" && method === "POST") {
      var body = null;
      try { body = init.body ? JSON.parse(init.body) : null; } catch (e) { return reply({ ok: false, error: "bad json" }, 400); }
      if (!body || typeof body !== "object") { return reply({ ok: false, error: "empty payload" }, 400); }
      var bUid = (typeof body.uid === "string") ? body.uid : "";
      var store = kqRead();
      store.items[bUid] = { d: body, t: Number(body.ts) || Date.now() };
      kqWrite(store);
      kqSchedulePush();                  /* 写完本机 → 3 秒去抖推送一次 */
      return reply({ ok: true, ts: body.ts || null, local: true });
    }
    return reply({ ok: false, error: "unsupported" }, 405);
  };

  /* ---------- NAS 同步（多设备互通，独立槽位 kaoqin） ---------- */
  var NAS_KEY = "mini-apps-nas-v1";      /* 与献血/跑步页共用：那边连过这里就是已连接 */
  var KQ_STATE = { busy: false, lastMsg: "", pending: false, lastSync: 0, lastErr: "" };

  function nasCfg() {
    try { return JSON.parse(localStorage.getItem(NAS_KEY) || "null"); } catch (e) { return null; }
  }
  function nasSaveCfg(c) {
    try {
      if (c === null || c === undefined) { localStorage.removeItem(NAS_KEY); }
      else { localStorage.setItem(NAS_KEY, JSON.stringify(c || {})); }
    } catch (e) {}
  }
  function nasBase() {
    var c = nasCfg();
    return (c && c.url) ? String(c.url).replace(/\/+$/, "") : "";
  }
  function nasConfigured() {
    var c = nasCfg();
    return !!(c && c.url && c.token && c.user);
  }
  function nasReq(method, path, body) {
    var c = nasCfg();
    var url = nasBase() + path;
    var opts = { method: method, headers: {}, cache: "no-store" };
    if (c && c.token) { opts.headers["Authorization"] = "Bearer " + c.token; }
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(url, opts).then(function (r) {
      return r.text().then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) {}
        return { status: r.status, ok: r.ok, body: j, raw: t };
      });
    });
  }
  function nasHint(err) {
    var m = String((err && err.message) || err || "");
    if (/Failed to fetch|NetworkError|load failed|Network request failed/i.test(m)) {
      return "连不上 NAS。检查：① 手机是否和 NAS 在同一网络（或已做端口映射）② 地址是否带 http:// 和端口 ③ 若本页是 https 而地址是 http，浏览器会拦（改从 NAS 提供的地址打开页面）";
    }
    return m || "同步失败";
  }
  function kqCanon(o) {                  /* 稳定序列化：键排序，避免键序不同被误判成“有变化” */
    if (o === null || o === undefined || typeof o !== "object") { return JSON.stringify(o === undefined ? null : o); }
    if (Object.prototype.toString.call(o) === "[object Array]") {
      return "[" + o.map(kqCanon).join(",") + "]";
    }
    var ks = Object.keys(o).sort();
    return "{" + ks.map(function (k) { return JSON.stringify(k) + ":" + kqCanon(o[k]); }).join(",") + "}";
  }
  function escH(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* 登录并保存配置（与另两个公开页共用同一份配置） */
  function nasLogin(url, user, pass) {
    var base = String(url || "").replace(/\/+$/, "");
    if (!/^https?:\/\//.test(base)) { base = "http://" + base; }
    return fetch(base + "/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: user, pass: pass })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || !j.ok) { throw new Error(j.error || "登录失败"); }
        var old = nasCfg() || {};
        nasSaveCfg({ url: base, user: j.user, token: j.token, auto: (old.auto === false) ? false : true });
        return j;
      });
    });
  }

  /* 拉取合并：每个 uid 比 ts，大者胜（相同保留本机） */
  function kqMergeInto(remoteItems, store) {
    var changed = 0, uid, r, rt, mine, mt;
    for (uid in (remoteItems || {})) {
      if (!Object.prototype.hasOwnProperty.call(remoteItems, uid)) { continue; }
      r = remoteItems[uid];
      if (!r || typeof r !== "object" || r.d === undefined) { continue; }
      rt = Number(r.t) || 0;
      mine = store.items[uid];
      mt = mine ? (Number(mine.t) || 0) : -1;
      if (!mine || rt > mt) { store.items[uid] = { d: r.d, t: rt }; changed++; }
    }
    return changed;
  }
  function kqOneUrl() {
    var c = nasCfg() || {};
    return "/api/one?user=" + encodeURIComponent(c.user) + "&app=" + KQ_APP;
  }
  function nasSyncKind(round, mode) {
    round = round || 0;
    if (!nasConfigured()) { return Promise.resolve({ ok: false, msg: "未连接 NAS" }); }
    return nasReq("GET", kqOneUrl()).then(function (g) {
      if (g.status === 401) { throw new Error("登录已过期，请重新连接"); }
      if (!g.ok || !g.body || !g.body.ok) { throw new Error((g.body && g.body.error) || ("读取失败 " + g.status)); }
      var remote = g.body.data, rev = g.body.rev;
      var remoteItems = (remote && remote.items) ? remote.items : {};
      var store = kqRead();
      var pulled = kqMergeInto(remoteItems, store);
      if (pulled) { kqWrite(store); }
      if (mode === "download") { return { ok: true, rev: rev, pulled: pulled, pushed: false }; }
      var mine = kqRead().items;
      if (kqCanon(remoteItems) === kqCanon(mine)) { return { ok: true, rev: rev, pulled: pulled, pushed: false }; }
      return nasReq("PUT", kqOneUrl(), { baseRev: rev, data: { v: 1, items: mine } }).then(function (p) {
        if (p.status === 409 && round < 3) { return nasSyncKind(round + 1, mode); }  /* 别人刚改过 → 重取再合并 */
        if (!p.ok || !p.body || !p.body.ok) { throw new Error((p.body && p.body.error) || ("写入失败 " + p.status)); }
        return { ok: true, rev: p.body.rev, pulled: pulled, pushed: true };
      });
    });
  }
  /* 页面数据刷新：优先调用页面自己的刷新函数，没有就整页重载一次（防死循环） */
  function kqRefreshPage() {
    try {
      if (typeof loadFromServer === "function") { loadFromServer(); return true; }
      if (typeof loadAllData === "function") {
        loadAllData();
        if (typeof renderPersonSwitch === "function") { renderPersonSwitch(); }
        if (typeof render === "function") { render(); }
        return true;
      }
    } catch (e) {}
    try {
      if (sessionStorage.getItem("kaoqin_nas_reloaded")) { return false; }
      sessionStorage.setItem("kaoqin_nas_reloaded", "1");
      location.reload();
      return true;
    } catch (e) { return false; }
  }
  function nasSync(reason) {
    if (!nasConfigured()) { return Promise.resolve({ ok: false, msg: "未连接 NAS（请先连接并登录）" }); }
    if (KQ_STATE.busy) { return Promise.resolve({ ok: false, msg: "正在同步中" }); }
    KQ_STATE.busy = true; KQ_STATE.lastMsg = "同步中…"; kqPaintStatus();
    return nasSyncKind(0, "both").then(function (r) {
      KQ_STATE.busy = false; KQ_STATE.pending = false; KQ_STATE.lastErr = "";
      KQ_STATE.lastSync = Date.now();
      try { var c = nasCfg() || {}; c.lastSync = KQ_STATE.lastSync; nasSaveCfg(c); } catch (e) {}
      KQ_STATE.lastMsg = "已同步（" + (r.pushed ? "本机改动已上传" : "无需上传") +
        (r.pulled ? "，拉回 " + r.pulled + " 份" : "") + "，" + (reason || "手动") + "）";
      if (r.pulled) { kqRefreshPage(); }
      kqPaintStatus(); kqPaintMsg(KQ_STATE.lastMsg, true);
      return { ok: true, msg: KQ_STATE.lastMsg, pulled: r.pulled, pushed: r.pushed };
    }).catch(function (e) {
      KQ_STATE.busy = false; KQ_STATE.pending = true; KQ_STATE.lastErr = nasHint(e);
      KQ_STATE.lastMsg = "同步失败：" + KQ_STATE.lastErr;
      kqPaintStatus(); kqPaintMsg(KQ_STATE.lastMsg, false);
      return { ok: false, msg: KQ_STATE.lastMsg, error: KQ_STATE.lastErr };
    });
  }
  /* 覆盖本机（清理用）：用服务器数据整份替换本机，本机多出来的 uid 会被清掉 */
  function nasOverwrite() {
    if (!nasConfigured()) { return Promise.resolve({ ok: false, msg: "未连接 NAS（请先连接并登录）" }); }
    return nasReq("GET", kqOneUrl()).then(function (g) {
      if (g.status === 401) { throw new Error("登录已过期，请重新连接"); }
      if (!g.ok || !g.body || !g.body.ok) { throw new Error((g.body && g.body.error) || ("读取失败 " + g.status)); }
      var remote = g.body.data;
      var items = (remote && remote.items) ? remote.items : {};
      var clean = {}, uid;
      for (uid in items) {
        if (!Object.prototype.hasOwnProperty.call(items, uid)) { continue; }
        clean[uid] = { d: items[uid].d, t: Number(items[uid].t) || 0 };
      }
      kqWrite({ items: clean });
      /* 让页面自己的 cloudTs 归零，否则页面会拿内存里的旧数据反推回本机 */
      try {
        var u = kqUid();
        if (u) { localStorage.removeItem("kaoqin_cloud_ts_" + u); }
      } catch (e) {}
      kqRefreshPage();
      var n = Object.keys(clean).length;
      return { ok: true, msg: "已用服务器数据覆盖本机（" + n + " 份使用者数据）", count: n };
    }).catch(function (e) {
      var m = nasHint(e);
      kqPaintMsg("覆盖失败：" + m, false);
      return { ok: false, msg: "覆盖失败：" + m };
    });
  }
  function kqAutoSync(reason) {
    if (!nasConfigured()) { return; }

  var __kqPushTimer = null;
  function kqSchedulePush() {
    if (!nasConfigured()) { return; }

  }
  window.addEventListener("online", function () { kqAutoSync("网络恢复"); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { kqAutoSync("回到前台"); }

  /* ---------- 状态显示 ---------- */
  function kqWhen(ts) {
    if (!ts) { return "尚未同步"; }
    var t = new Date(ts);
    return (t.getMonth() + 1) + "月" + t.getDate() + "日 " +
      ("0" + t.getHours()).slice(-2) + ":" + ("0" + t.getMinutes()).slice(-2);
  }
  function kqPaintStatus() {

    var ts = KQ_STATE.lastSync || (c.lastSync ? Number(c.lastSync) : 0);
    el.textContent = "已连接 " + c.user + " @ " + String(c.url || "").replace(/^https?:\/\//, "") +
      "　最后同步：" + kqWhen(ts) + (KQ_STATE.pending ? "　有未上传的数据" : "");
    el.style.color = KQ_STATE.pending ? "#ffd28a" : "#8fe3a8";

  /* ---------- 左下角小圆按钮 + 紧凑面板 ---------- */

      "width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(13,148,136,.35);" +

  function showNas() {

      "<button id='ls-kq-disconnect' style='flex:1;padding:11px;border-radius:10px;border:1px solid #5a2a30;background:#2a1a1e;color:#ffb4b4;cursor:pointer'>断开</button></div>" +
      "<div style='border-top:1px solid #2a3040;margin:2px 0 10px'></div>" +
      "<div style='display:flex;gap:8px;margin-bottom:8px'>" +
      "<button id='ls-kq-sync' style='flex:1.2;padding:11px;border-radius:10px;border:1px solid #2c4a86;background:#1b2e52;color:#cfe0ff;cursor:pointer'>立即同步</button>" +
      "<button id='ls-kq-overwrite' style='flex:1.4;padding:11px;border-radius:10px;border:1px solid #5a2a30;background:#2a1a1e;color:#ffb4b4;cursor:pointer'>覆盖本机（清理用）</button></div>" +
      "<div style='border-top:1px solid #2a3040;margin:12px 0 8px'></div>" +
      "<div style='font-size:12.5px;color:#9aa3b2;margin-bottom:4px'>修改口令（本机已连接时，原口令可留空）</div>" +
      inp("ls-kq-old", "", "原口令", "password") +
      inp("ls-kq-new", "", "新口令（至少 4 位）", "password") +
      inp("ls-kq-new2", "", "再输一次新口令", "password") +
      "<button id='ls-kq-passwd' style='width:100%;padding:10px;border-radius:10px;border:1px solid #2c4a86;background:#1b2e52;color:#cfe0ff;cursor:pointer;margin-bottom:6px'>保存新口令</button>" +
      "<label style='display:flex;gap:8px;align-items:center;font-size:12.5px;color:#9aa3b2'>" +
      "<input id='ls-kq-auto' type='checkbox'" + ((c.auto === false) ? "" : " checked") + "> 打开页面时自动同步（保存后 3 秒也会自动补传）</label>" +
      "<div style='color:#8b94a6;font-size:11.5px;margin-top:8px'>合并规则：每位使用者（口令 uid）各存一份，按时间戳取新的（相同保留本机）。" +
      "连不上时数据仍在本机，联网后再点「立即同步」即可补传。</div>" +
      "<div id='ls-kq-msg' style='margin-top:8px;font-size:12.5px;color:#9fd0ff'></div>";
    mask.appendChild(card);
    document.body.appendChild(mask);
    kqPaintStatus();
    document.getElementById("ls-kq-x").addEventListener("click", function () { mask.remove(); });
    /* 地址自动识别时锁定输入框，只让用户填口令 */
    (function () {
      var uf = document.getElementById("ls-kq-url");
      if (!uf) { return; }

        uf.parentNode.insertBefore(tip, uf.nextSibling);

    })();
    document.getElementById("ls-kq-connect").addEventListener("click", function () {
      var url = document.getElementById("ls-kq-url").value.trim();

      }).then(function (r) {

    document.getElementById("ls-kq-auto").addEventListener("change", function () {

    document.getElementById("ls-kq-overwrite").addEventListener("click", function () {
      var btn = this;

      nasOverwrite().then(function (r) { kqPaintMsg(r.msg, r.ok); kqPaintStatus(); });
    });
    document.getElementById("ls-kq-passwd").addEventListener("click", function () {
      var cc = nasCfg() || {};
      var user = ((document.getElementById("ls-kq-user") || {}).value || "").trim() || cc.user;
      var oldp = (document.getElementById("ls-kq-old") || {}).value || "";
      var n1 = (document.getElementById("ls-kq-new") || {}).value || "";
      var n2 = (document.getElementById("ls-kq-new2") || {}).value || "";
      if (!user) { kqPaintMsg("请先填使用者名字", false); return; }

      if (n1 !== n2) { kqPaintMsg("两次输入的新口令不一致", false); return; }
      kqPaintMsg("正在修改口令…", true);
      nasReq("POST", "/api/passwd", { user: user, old: oldp, new: n1 }).then(function (r) {
        if (!r.ok || !r.body || !r.body.ok) { throw new Error((r.body && r.body.error) || ("修改失败 " + r.status)); }
        var c2 = nasCfg() || {};
        c2.token = r.body.token; c2.user = r.body.user;
        nasSaveCfg(c2);
        ["ls-kq-old", "ls-kq-new", "ls-kq-new2"].forEach(function (id) {
          var el = document.getElementById(id); if (el) { el.value = ""; }

        kqPaintStatus();
      }).catch(function (e) { kqPaintMsg(nasHint(e), false); });
    });
  }

  /* 调试/测试入口 */
  window.__lsNasKaoqin = {
    cfg: nasCfg, save: nasSaveCfg, login: nasLogin, sync: nasSync, overwrite: nasOverwrite
  };

  function notice() {
    var FLAG = "kaoqin_local_notice_v1";
    try { if (localStorage.getItem(FLAG)) return; } catch (e) { return; }
    var box = document.createElement("div");
    box.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:10000;background:#1b2130;color:#dfe6ef;" +
      "border:1px solid #2a3040;border-radius:12px;padding:10px 12px;font:13px/1.6 -apple-system,'Microsoft YaHei',sans-serif;" +
      "box-shadow:0 6px 18px rgba(0,0,0,.45)";
    box.innerHTML = "<b>公开示例版：数据只保存在你自己的浏览器里</b>，不连任何服务器、也不会上传。" +
      "想多设备互通，点左下角 ⇅ 连接你自己的 NAS（可选）。" +
      "换设备或清理浏览器数据前，请先用页面里的「备份 / 导出」保存一份。";
    var ok = document.createElement("button");
    ok.textContent = "知道了";
    ok.style.cssText = "margin-left:8px;padding:4px 10px;border-radius:8px;border:1px solid #38415a;background:#252d3f;color:#cfd8e3;cursor:pointer";
    ok.addEventListener("click", function () {
      try { localStorage.setItem(FLAG, "1"); } catch (e) {}
      box.remove();
    });
    box.appendChild(ok);
    document.body.appendChild(box);
  }
  function boot() {
    kqEnsureUI();
    notice();
    /* 打开页面时自动同步（auto !== false 时），稍等页面自身启动完成 */
    setTimeout(function () { kqAutoSync("打开页面"); }, 900);
  }
  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", boot); }

<script>
"use strict";
/* ============================================================
 * 考勤助手 · 手机版（跨年可编辑版）
 * 数据来源：公开示例数据（原始考勤表已在公开版中移除）
 * 功能：正方形日历、月份可跨年翻页、每人每月工资可自定义、
 *       30/31天休班额度+积攒结转、2月做几天发几天、季节工时加班费
 * 编辑内容保存在本机浏览器（localStorage），可通过右上角"管理"导出/导入备份
 * ============================================================ */
const DATA = {"meta":{"year":2026,"source":"示例数据（公开版已移除原始考勤表）","generated":""},"people":[],"months":{}};

const BASE_YEAR = DATA.meta.year;
const STATUS = {
  0:{n:"未记录", c:""},
  1:{n:"班", c:"s1"},
  2:{n:"休", c:"s2"},
  3:{n:"放", c:"s3"},
  4:{n:"加", c:"s4"},
  5:{n:"迟", c:"s5"}
};
/* ===== 人员（可编辑/添加/删除，按口令各自保存） ===== */
function defaultPersons(){ return [
  {id:"p1", name:"员工A", base:0},
  {id:"p2", name:"员工B", base:0}
]; }
let PERSONS = defaultPersons();
function personById(pid){
  return PERSONS.find(p=>p.id===pid) || {id:pid, name:pid, base:0};
}
const PERSONS_KEY = "kaoqin_persons_v1";

/* ===== 本地存储（按口令 uid 隔离，互不可见） =====
 * 考勤编辑：{pid: {"YYYY-M": {day: {am,pm,ot?,note?}}}} */
const EDITS_KEY  = "kaoqin_edits_v2";
const SAL_KEY    = "kaoqin_salary_v1";
const DEBT_KEY   = "kaoqin_debts_v1";
const INCOME_KEY = "kaoqin_income_v1";
const MIGRATE_KEY = "kaoqin_migrated";
let EDITS   = {};
let SAL     = {};
let DEBTS   = [];
let INCOMES = [];
let USE_SRC = true; /* 是否显示（公开示例数据）源表预填数据（仅老用户/迁移用户为 true，新用户为 false 得到干净空表） */
function keyOf(base){ return UID ? base + "_" + UID : base; }
function loadJSON(key, fallback){
  try { const v = JSON.parse(localStorage.getItem(key) || "null"); return v==null ? fallback : v; }
  catch(e){ return fallback; }
}
/* 旧版本 v1 key → v2 旧 key（无口令时代的历史迁移，保留） */
function migrateV1(){
  try{
    const v1 = localStorage.getItem("kaoqin_edits_v1");
    if (v1 && !localStorage.getItem(EDITS_KEY)){
      const old = JSON.parse(v1) || {};
      const nv = {};
      for (const pid in old){
        for (const m in old[pid]){
          if (!/^\d+$/.test(m)) continue;
          if (!nv[pid]) nv[pid] = {};
          nv[pid][BASE_YEAR+"-"+m] = old[pid][m];
        }
      }
      localStorage.setItem(EDITS_KEY, JSON.stringify(nv));
      localStorage.removeItem("kaoqin_edits_v1");
    }
  }catch(e){}
}
/* 按当前 uid 加载全部数据；未设口令时为干净空状态。
 * 首次设置口令时：检测到"无口令时代"的旧数据 → 迁移到当前口令空间（老用户）；
 * 没有任何旧数据 → 全新干净空表格（不显示源表考勤、不导入源表欠款）。 */
function loadAllData(){
  migrateV1();
  if (!UID){
    EDITS = {}; SAL = {}; DEBTS = []; INCOMES = []; PERSONS = defaultPersons();
    return;
  }
  EDITS   = loadJSON(keyOf(EDITS_KEY), {});
  SAL     = loadJSON(keyOf(SAL_KEY), {});
  DEBTS   = loadJSON(keyOf(DEBT_KEY), null);
  INCOMES = loadJSON(keyOf(INCOME_KEY), []);
  PERSONS = loadJSON(keyOf(PERSONS_KEY), null);
  if (!PERSONS) PERSONS = defaultPersons();
  const hasLegacy = [EDITS_KEY, SAL_KEY, DEBT_KEY, INCOME_KEY].some(k => localStorage.getItem(k) != null);
  if (DEBTS === null && hasLegacy && !localStorage.getItem(MIGRATE_KEY)){
    /* 老用户：旧版数据迁入本口令空间，保留源表 */
    EDITS = loadJSON(EDITS_KEY, {});
    SAL   = loadJSON(SAL_KEY, {});
    DEBTS = loadJSON(DEBT_KEY, []);
    INCOMES = loadJSON(INCOME_KEY, []);
    PERSONS = defaultPersons();
    USE_SRC = true;
    localStorage.setItem(MIGRATE_KEY, "1");
    saveEdits(); saveSal(); saveDebts(); saveIncome(); savePersons();
  } else if (DEBTS === null){
    /* 全新用户：干干净净的空表格 */
    DEBTS = []; if (!INCOMES) INCOMES = [];
    USE_SRC = false;
  } else {
    USE_SRC = true;
  }
}

/* ===== 访问口令（身份隔离，数据互不可见） =====
 * 每个使用者设置自己的口令 → 哈希后作为身份 uid 存浏览器；
 * 服务器按 uid 分文件存储，不知道口令就连文件名都猜不出。
 * 口令不存明文，忘了解锁不了自己的数据，请牢记。 */
const UID_KEY = "kaoqin_uid";
let UID = "";
function sha256hex(str){
  /* 标准 SHA-256（纯 JS，零依赖），返回 64 位小写十六进制 */
  function rrot(x,n){ return (x>>>n)|(x<<(32-n)); }
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
         0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
         0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
         0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
         0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
         0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
         0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
         0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = unescape(encodeURIComponent(str));
  var len = bytes.length, ml = len*8;
  var n = (((len+8)>>6)+1)<<6;
  var msg = new Uint8Array(n);
  for (var i=0;i<len;i++) msg[i]=bytes.charCodeAt(i);
  msg[len]=0x80;
  var dv = new DataView(msg.buffer);
  dv.setUint32(n-8, Math.floor(ml/4294967296));
  dv.setUint32(n-4, ml>>>0);
  var w = new Int32Array(64);
  for (var i2=0;i2<n;i2+=64){
    for (var t=0;t<16;t++) w[t]=dv.getInt32(i2+t*4);
    for (var t=16;t<64;t++){
      var s0=rrot(w[t-15],7)^rrot(w[t-15],18)^(w[t-15]>>>3);
      var s1=rrot(w[t-2],17)^rrot(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (var t=0;t<64;t++){
      var S1=rrot(e,6)^rrot(e,11)^rrot(e,25);
      var ch=(e&f)^((~e)&g);
      var t1=(h+S1+ch+K[t]+w[t])|0;
      var S0=rrot(a,2)^rrot(a,13)^rrot(a,22);
      var maj=(a&b)^(a&c)^(b&c);
      var t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out="";
  for (var j=0;j<8;j++) out += (H[j]>>>0).toString(16).padStart(8,"0");
  return out;
}
function initUid(){
  UID = localStorage.getItem(UID_KEY) || "";
}
function setUid(pin){
  UID = sha256hex("kq:" + pin);
  localStorage.setItem(UID_KEY, UID);
}
function clearUid(){
  localStorage.removeItem(UID_KEY);
  localStorage.removeItem(cloudTsKey());
  UID = "";
}

/* ===== 云端同步（保存到 NAS 后台，跨设备共享） =====
 * 服务器：GET /userdata?uid= 读、POST /save 写（data_user_<uid>.json）
 * 合并规则：启动时若服务器数据比本机新 → 以服务器为准覆盖；
 *           否则把本机数据推送到服务器。保存后自动同步。 */
let CLOUD = { status: "off" }; /* off 仅本机 | loading 同步中 | syncing 保存中 | ok 已同步 | fail 未同步 */
function cloudTsKey(){ return "kaoqin_cloud_ts" + (UID ? "_" + UID : ""); }
let _syncTimer = null;
function cloudTs(){ return Number(localStorage.getItem(cloudTsKey()) || 0); }
function setCloudTs(ts){ localStorage.setItem(cloudTsKey(), String(ts)); }
function syncToServer(){
  if (!UID) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(doSync, 800);
}
async function doSync(){
  const payload = { uid: UID, edits: EDITS, salary: SAL, debts: DEBTS, incomes: INCOMES, persons: PERSONS, useSrc: USE_SRC, ts: Date.now() };
  CLOUD.status = "syncing"; updateCloudUI();
  try {
    const r = await fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const j = await r.json().catch(()=>null);
    if (r.ok && j && j.ok){ CLOUD.status = "ok"; setCloudTs(payload.ts); }
    else CLOUD.status = "fail";
  } catch(e){ CLOUD.status = "off"; }
  updateCloudUI();
}
async function loadFromServer(){
  if (!UID){ updateCloudUI(); return; }
  CLOUD.status = "loading"; updateCloudUI();
  try {
    const r = await fetch("/userdata?uid=" + UID);
    const j = await r.json().catch(()=>null);
    if (r.ok && j && j.ok && j.data && j.data.ts){
      const st = Number(j.data.ts);
      if (st > cloudTs()){
        /* 服务器比本机新：以服务器为准 */
        if (j.data.edits && typeof j.data.edits === "object") EDITS = j.data.edits;
        if (j.data.salary && typeof j.data.salary === "object") SAL = j.data.salary;
        if (Array.isArray(j.data.debts)) DEBTS = j.data.debts;
        if (Array.isArray(j.data.incomes)) INCOMES = j.data.incomes;
        if (Array.isArray(j.data.persons) && j.data.persons.length) PERSONS = j.data.persons;
        if (j.data.useSrc === false) USE_SRC = false;
        else if (j.data.useSrc === true) USE_SRC = true;
        /* useSrc 缺失（旧服务器数据）：保持本地值，避免新用户被强制显示源表 */
        setCloudTs(st);
        saveEdits(); saveSal(); saveDebts(); saveIncome(); savePersons();
        renderPersonSwitch(); render();
        checkAutoInstallment();
        CLOUD.status = "ok";
      } else {
        /* 本机与服务器相同或更新 → 推送本机 */
        CLOUD.status = "ok";
        syncToServer();
      }
    } else if (r.status === 403){
      CLOUD.status = "off";
    } else {
      /* 服务器还没有该使用者数据 → 上传本机 */
      syncToServer();
    }
  } catch(e){ CLOUD.status = "off"; }
  updateCloudUI();
}
function updateCloudUI(){
  const el = document.getElementById("cloudState");
  if (!el) return;
  if (!UID){ el.textContent = "未设置口令"; el.style.color = "#f5b75e"; return; }
  const map = { off:["仅本机","#9aa7a2"], loading:["同步中…","#f5b75e"], syncing:["保存中…","#f5b75e"], ok:["已同步","#7ce0b8"], fail:["未同步","#f28b82"] };
  const m = map[CLOUD.status] || map.off;
  el.textContent = m[0];
  el.style.color = m[1];
}

function money(v){

  const s = (r % 1 === 0)
    ? r.toLocaleString("zh-CN")
    : r.toLocaleString("zh-CN", {minimumFractionDigits:1, maximumFractionDigits:1});
  return (neg?"-¥":"¥") + s;
}

  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2000);

function daysIn(y, m){ return new Date(y, m, 0).getDate(); }
function sum(arr){ return arr.reduce((a,b)=>a+(num(b)||0),0); }

/* ===== 数据访问（2026年取源表，其他年份为空可编辑） ===== */
function personSource(pid, y, m){
  if (USE_SRC && y === BASE_YEAR && DATA.months[String(m)] && DATA.months[String(m)].p && DATA.months[String(m)].p[pid]){
    return DATA.months[String(m)].p[pid];
  }
  return null;
}
function getDay(pid, y, m, d){
  const p = personSource(pid, y, m);
  const e = editsOf(pid, y, m)[String(d)] || {};
  return {
    am: e.am!=null ? e.am : (p ? (p.am[d-1]||0) : 0),
    pm: e.pm!=null ? e.pm : (p ? (p.pm[d-1]||0) : 0),
    ot: e.ot!=null ? e.ot : (p ? (num(p.ot[d-1])||0) : 0),
    note: e.note!=null ? e.note : (p ? ((p.notes||[]).filter(n=>n.day===d).map(n=>n.text).join("；")) : ""),
    edited: !!(e && Object.keys(e).length)
  };
}
function sourceSalary(pid, y, m){
  const p = personSource(pid, y, m);
  return (p && p.salary && num(p.salary["总计"])!=null) ? p.salary : null;
}

/* ===== 月度统计（编辑后重算） ===== */
function monthStats(pid, y, m){
  const D = daysIn(y, m);
  const st = { "班":0, "休":0, "放":0, "加":0, "迟":0 };
  let ot = 0, any = false;
  for (let d=1; d<=D; d++){
    const g = getDay(pid, y, m, d);
    for (const half of [g.am, g.pm]){
      if (half!==0){
        any = true;
        const s = STATUS[half];
        if (s && st[s.n]!=null) st[s.n] += 0.5;
      }
    }
    ot += g.ot;
  }
  return { stats: st, otHours: r2(ot), any, editedDays: Object.keys(editsOf(pid,y,m)).length, days: D };
}

/* ============================================================
 * 工资计算（新规则）
 * 日薪 = 月薪 ÷ 当月天数；时薪 = 日薪 ÷ 当月每天工时
 * 工时：5月1日-11月30日 = 8.5小时；12月1日-次年4月30日 = 8小时
 * 休班额度：30天月 2 天 / 31天月 3 天，额度内不扣工资
 *   30天月：休0天→多发1天工资，剩余2天积攒；休1天→不奖不扣，剩余1天积攒；休2天→不奖不扣；超2天→每天扣1天
 *   31天月：休0/1/2天→多发1天工资（少休即奖）；休3天→不奖不扣；超3天→每天扣1天
 *   上月剩余额度自动积攒，下月休息先抵扣积攒（延长休息不算工资）
 * 2月：做几天发几天 = 日薪 × 出勤天数（班/加） + 加班费，不参与额度与积攒
 * ============================================================ */
function monthHours(m){ return (m>=5 && m<=11) ? 8.5 : 8; }

function calcMonthPay(pid, y, m, carryIn){
  const D = daysIn(y, m);
  const salary = getSalary(pid, y, m);
  const daily = salary / D;
  const hourly = daily / monthHours(m);
  const S = monthStats(pid, y, m);
  const otPay = S.otHours * hourly;
  const rest = (S.stats["休"] || 0) + (S.stats["放"] || 0); /* 放假也算休班 */
  const base = { y, m, D, salary, daily, hourly, otHours:S.otHours, otPay,
                 rest, carryIn, any:S.any, edited:S.editedDays, stats:S.stats };
  /* 无考勤记录月份：不参与额度/积攒/奖励，积攒原样结转，工资待计算 */
  if (!S.any && !S.edited){
    return Object.assign(base, { attend:null, bonus:0, over:0, useCarry:0, restEff:0,
      carryOut: carryIn, basePay: salary, bonusPay:0, overPay:0, total: null });
  }
  /* 2月：做几天发几天 */
  if (m === 2){
    let attend = 0;
    for (let d=1; d<=D; d++){
      const g = getDay(pid, y, m, d);
      for (const hh of [g.am, g.pm]) if (hh===1 || hh===4) attend += 0.5;
    }
    const basePay = daily * attend;
    return Object.assign(base, { attend: r2(attend), bonus:0, over:0, useCarry:0, restEff:0,
      carryOut:0, basePay, bonusPay:0, overPay:0, total: r2(basePay + otPay) });
  }
  /* 先抵扣上月积攒（延长休息不算工资） */
  const useCarry = Math.min(carryIn, rest);
  const restEff = rest - useCarry;
  let bonus = 0, over = 0, addCarry = 0;
  if (D === 30){
    if (restEff === 0){
      if (rest === 0){ bonus = 1; addCarry = 2; }
    } else if (restEff === 1){ addCarry = 1; }
    else if (restEff > 2){ over = restEff - 2; }
  } else if (D === 31){
    if (restEff === 0){
      if (rest === 0){ bonus = 1; addCarry = 3; }
    } else if (restEff === 1){ bonus = 1; addCarry = 1; } /* 休1天：1天叠加下月，另1天工作→多发1天工资（休班也不扣） */
    else if (restEff === 2){ bonus = 1; addCarry = 0; } /* 休2天：剩1天工作→多发1天工资；休班不扣；不叠加 */
    else if (restEff > 3){ over = restEff - 3; }
  }
  const carryOut = carryIn - useCarry + addCarry;
  const basePay = salary;
  return Object.assign(base, { attend:null, bonus, over, useCarry, restEff, carryOut,
    basePay, bonusPay: r2(bonus*daily), overPay: r2(over*daily), total: r2(basePay + otPay + bonus*daily - over*daily) });
}

/* 从最早有数据年份（2026）顺序结算到目标月，保证积攒连续 */
function calcFromStart(pid, y, m){
  let carry = 0;
  if (y > BASE_YEAR){
    for (let yy = BASE_YEAR; yy < y; yy++){
      for (let i=1; i<=12; i++) carry = calcMonthPay(pid, yy, i, carry).carryOut;
    }
  }
  for (let i=1; i<=m; i++){
    const r = calcMonthPay(pid, y, i, carry);
    carry = r.carryOut;
    if (i === m) return r;
  }
}
function getYearCalc(pid, y){
  let carry = 0, out = [];
  if (y > BASE_YEAR){
    for (let yy = BASE_YEAR; yy < y; yy++){
      for (let i=1; i<=12; i++) carry = calcMonthPay(pid, yy, i, carry).carryOut;
    }
  }
  for (let m=1; m<=12; m++){
    const r = calcMonthPay(pid, y, m, carry);
    out.push(r); carry = r.carryOut;
  }
  return out;
}
/* 月份工资：有考勤→新规则；无考勤→源表预填；都没有→null */
function monthWage(pid, y, m){
  const r = calcFromStart(pid, y, m);
  if (r.any || r.edited) return num(r.total);
  const s = sourceSalary(pid, y, m);
  return s ? num(s["总计"]) : null;
}

/* ============================================================
 * 月度视图
 * ============================================================ */
function renderMonth(){
  const y = state.year, m = state.month, pid = state.person;
  const r = calcFromStart(pid, y, m);
  const D = r.D;
  const firstDow = (new Date(y, m-1, 1).getDay()+6)%7; // 周一=0
  const today = new Date();
  const isToday = (d)=> today.getFullYear()===y && today.getMonth()+1===m && today.getDate()===d;

  let cells = [];
  for (let i=0;i<firstDow;i++) cells.push('<div class="day blank"></div>');
  for (let d=1; d<=D; d++){
    const g = getDay(pid, y, m, d);
    const cls = "day" + (isToday(d)?" today":"") + (g.edited?" edited":"");
    cells.push('<div class="'+cls+'" onclick="openEditor('+d+')">'+
      (g.edited?'<span class="eddot" title="本地编辑"></span>':'')+
      '<span class="dnum">'+d+(g.ot!==0?'<span class="otdot" title="加班"></span>':'')+'</span>'+
      '<span class="bars"><span class="bar am '+STATUS[g.am].c+'"></span><span class="bar pm '+STATUS[g.pm].c+'"></span></span>'+
      '</div>');
  }

  const st = r.stats;
  const hasEdit = r.edited > 0;
  const noData = !r.any && !r.edited;
  const srcSal = sourceSalary(pid, y, m);

  const banner = noData
    ? '<div class="card"><div class="warn">本月暂无考勤记录，工资按'+(srcSal?'源表预填':'待计算')+'。点击日期即可补录，录入后按新规则自动算工资。</div></div>'
    : "";

  /* 工资明细 */
  const daily = r.daily, hourly = r.hourly;
  let rows = '';

function stepMonth(delta){
  let m = state.month + delta, y = state.year;
  if (m < 1){ m = 12; y--; }
  if (m > 12){ m = 1; y++; }
  state.year = y; state.month = m;
  renderPersonSwitch();
  render();
}
function stepYear(delta){
  state.year += delta;
  renderPersonSwitch();
  render();
}

function statusOptions(v){
  let s = "";
  for (let k=0;k<=5;k++){
    s += '<option value="'+k+'"'+(k===v?" selected":"")+'>'+STATUS[k].n+'</option>';
  }
  return s;
}
function openEditor(d){
  const y = state.year, m = state.month, pid = state.person;
  const g = getDay(pid, y, m, d);
  const e = editsOf(pid, y, m)[String(d)] || {};
  const p = personSource(pid, y, m);
  const today = new Date();
  const tag = (today.getFullYear()===y && today.getMonth()+1===m && today.getDate()===d) ? " · 今天" : "";
  const hasEdit = !!(e && Object.keys(e).length);
  const revertBtn = hasEdit
    ? '<button class="btn-ghost" onclick="revertDay('+d+')">恢复原值</button>'
    : "";
  sheetEl.innerHTML =
    '<div class="grip"></div>'+
    '<div class="st">'+y+'年'+m+'月'+d+'日 · 编辑考勤</div>'+
    '<div class="st-sub">'+personById(pid).name+' · '+tag.replace(" · ","")+'</div>'+
    '<div class="form-row"><label>上午</label><select id="edAm">'+statusOptions(g.am)+'</select></div>'+
    '<div class="form-row"><label>下午</label><select id="edPm">'+statusOptions(g.pm)+'</select></div>'+
    '<div class="form-row"><label>加班（小时）</label><input id="edOt" type="number" step="0.1" inputmode="decimal" value="'+(g.ot!==0?g.ot:"")+'" placeholder="如 1.5，无则留空"></div>'+
    '<div class="form-row"><label>备注</label><input id="edNote" type="text" placeholder="选填" value="'+esc(g.note)+'"></div>'+
    (hasEdit
      ? '<div class="warn">当前为本地编辑值；原表格为 上午：'+STATUS[(p?p.am[d-1]:0)||0].n+'，下午：'+STATUS[(p?p.pm[d-1]:0)||0].n+'。</div>'
      : '<div class="hint">修改后自动保存在本机浏览器，日历与统计实时更新。</div>')+
    '<button class="btn-close" onclick="saveDay('+d+')">保存</button>'+
    '<div class="btn-row">'+revertBtn+'<button class="btn-ghost" onclick="closeSheet()">取消</button></div>';
  sheetEl.classList.add("show");
  sheetMask.classList.add("show");
}
function saveDay(d){
  const pid = state.person, y = state.year, m = state.month;
  const am = +document.getElementById("edAm").value;
  const pm = +document.getElementById("edPm").value;
  const otRaw = document.getElementById("edOt").value;
  const note = document.getElementById("edNote").value.trim();
  const e = {am: am, pm: pm};
  const ot = parseFloat(otRaw);
  if (otRaw!=="" && !isNaN(ot)) e.ot = r2(ot);
  if (note) e.note = note;
  if (!EDITS[pid]) EDITS[pid] = {};
  if (!EDITS[pid][y+"-"+m]) EDITS[pid][y+"-"+m] = {};
  EDITS[pid][y+"-"+m][String(d)] = e;
  saveEdits();
  render();
  closeSheet();
  toast("已保存到本机");
}
function revertDay(d){
  const pid = state.person, y = state.year, m = state.month;
  if (EDITS[pid] && EDITS[pid][y+"-"+m]) {
    delete EDITS[pid][y+"-"+m][String(d)];
    if (!Object.keys(EDITS[pid][y+"-"+m]).length) delete EDITS[pid][y+"-"+m];
    if (!Object.keys(EDITS[pid]).length) delete EDITS[pid];
  }
  saveEdits();
  render();
  closeSheet();
  toast("已恢复表格原值");
}
function closeSheet(){
  sheetEl.classList.remove("show");
  sheetMask.classList.remove("show");
}
sheetMask.addEventListener("click", closeSheet);

function renderPersonRows(){
  const box = document.getElementById("personRows");

      '<input class="pname" type="text" value="'+esc(p.name)+'" placeholder="名字">'+

      '<button class="x" onclick="this.closest(\'.prow\').remove()" aria-label="删除">✕</button>'+

function addPersonRow(){
  const box = document.getElementById("personRows");
  if (!box) return;
  const div = document.createElement("div");
  div.className = "prow"; div.dataset.id = "";
  div.innerHTML = '<input class="pname" type="text" placeholder="新人员名字">'+
    '<input class="pbase" type="number" step="1" min="0" inputmode="decimal" placeholder="月薪">'+
    '<button class="x" onclick="this.closest(\'.prow\').remove()" aria-label="删除">✕</button>';
  box.appendChild(div);
}
function savePersonsForm(){
  const rows = document.querySelectorAll("#personRows .prow");
  const next = [];
  rows.forEach(row=>{
    const name = row.querySelector(".pname").value.trim();
    const base = parseFloat(row.querySelector(".pbase").value);
    if (!name) return; /* 空名字行忽略（等价删除） */
    next.push({ id: row.dataset.id || nid(), name, base: (!isNaN(base)&&base>0) ? r2(base) : 0 });
  });
  if (!next.length){ toast("至少保留一个人员"); return; }
  const oldIds = PERSONS.map(p=>p.id);
  const delIds = oldIds.filter(oid=>!next.find(p=>p.id===oid));
  PERSONS = next;
  delIds.forEach(oid=>{
    delete EDITS[oid];
    if (SAL.default) delete SAL.default[oid];
    for (const k in SAL){ if (k!=="default" && SAL[k] && SAL[k][oid]!=null) delete SAL[k][oid]; }
  });
  if (!PERSONS.find(p=>p.id===state.person)) state.person = PERSONS[0] ? PERSONS[0].id : "";
  savePersons(); saveEdits(); saveSal();
  renderPersonSwitch(); render();
  closeSheet();
  toast("人员已保存");
}
function switchUser(){
  if (!confirm("切换后将以新口令使用独立的数据空间，当前空间的数据仍保留在后台（用原口令可找回）。确定切换？")) return;
  clearUid();
  loadAllData();
  closeSheet();
  renderPersonSwitch(); render();
  openPinGate();
}

function savePin(){
  const p1 = document.getElementById("pin1").value;
  const p2 = document.getElementById("pin2").value;
  if (!p1 || p1.length < 4){ toast("口令至少 4 位"); return; }
  if (p1 !== p2){ toast("两次输入不一致"); return; }
  setUid(p1);

function onImport(ev){
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const j = JSON.parse(rd.result);
      if (!j || typeof j !== "object") throw new Error("bad");
      if (j.ver >= 2){
        EDITS = (j.edits && typeof j.edits==="object") ? j.edits : {};
        SAL = (j.salary && typeof j.salary==="object") ? j.salary : {};
        if (j.ver >= 3){
          if (Array.isArray(j.debts)) DEBTS = j.debts;
          if (Array.isArray(j.incomes)) INCOMES = j.incomes;
        }
        if (j.ver >= 4 && Array.isArray(j.persons) && j.persons.length) PERSONS = j.persons;
      } else {
        /* 兼容旧版：纯编辑结构 或 {edits:...} */
        EDITS = (j.edits && typeof j.edits==="object") ? j.edits : j;
        SAL = {};
      }
      /* 旧月份键 "M" → "2026-M" */
      for (const pid in EDITS){
        for (const k in EDITS[pid]){
          if (/^\d+$/.test(k)){
            const nk = BASE_YEAR+"-"+k;
            if (!EDITS[pid][nk]) EDITS[pid][nk] = EDITS[pid][k];
            delete EDITS[pid][k];
          }
        }
      }
      saveEdits(); saveSal(); saveDebts(); saveIncome();
      renderPersonSwitch();
      render();
      closeSheet();
      toast("备份已导入");
    }catch(e){ toast("备份文件无效"); }
  };
  rd.readAsText(f, "utf-8");
}

function saveDebtForm(id){
  const platform = document.getElementById("dfPlatform").value.trim();
  const total = parseFloat(document.getElementById("dfTotal").value);
  const periodsRaw = document.getElementById("dfPeriods").value;
  const perRaw = document.getElementById("dfPer").value;
  const leftPRaw = document.getElementById("dfLeftP").value;
  const leftTRaw = document.getElementById("dfLeftT").value;
  if (!platform){ toast("请填写平台名称"); return; }
  if (!(total>0) || isNaN(total)){ toast("请填写有效总欠款"); return; }
  const periods = periodsRaw==="" ? null : Math.max(0, Math.floor(parseFloat(periodsRaw)));
  const per = perRaw==="" ? null : parseFloat(perRaw);
  let leftPeriods = leftPRaw==="" ? (periods!=null?periods:null) : Math.max(0, Math.floor(parseFloat(leftPRaw)));
  let leftTotal = leftTRaw==="" ? total : parseFloat(leftTRaw);
  if (per>0 && leftPeriods>0 && (leftTRaw==="" || !document.getElementById("dfLeftT").dataset.manual)){
    /* 自动计算：剩余分期金额 = 每期金额 × 剩余分期期限 */
    leftTotal = r2(per * leftPeriods);
  }
  if (isNaN(leftTotal) || leftTotal<0) leftTotal = total;
  if (periods!=null && periods===0){ leftPeriods = null; leftTotal = total; }
  const dOld = id ? DEBTS.find(x=>x.id===id) : null;
  const changedPeriod = !dOld || dOld.per!==r2(per) || dOld.leftPeriods!==leftPeriods;
  const rec = { platform, total: r2(total), periods: periods!=null&&periods>0?periods:null, per: per!=null&&per>0?r2(per):null, leftPeriods, leftTotal: r2(leftTotal) };
  if (changedPeriod && rec.periods && rec.per && rec.leftPeriods>0) rec.lastAuto = todayStr();
  if (id){
    const d = DEBTS.find(x=>x.id===id);
    if (d) Object.assign(d, rec);
  } else {
    rec.id = nid();
    rec.createdAt = todayStr();
    if (!rec.lastAuto) rec.lastAuto = todayStr();
    DEBTS.push(rec);
  }
  saveDebts();
  render();
  closeSheet();
  toast(id?"已保存":"已新增");
}
function autoLeftTotal(){
  const el = document.getElementById("dfLeftT");
  if (!el || el.dataset.manual) return; /* 用户手动改过剩余金额 → 不自动覆盖 */
  const per = parseFloat(document.getElementById("dfPer").value);
  const lp  = parseInt(document.getElementById("dfLeftP").value);
  if (per>0 && lp>0) el.value = r2(per * lp);
}
/* 每月 10 号自动还一期：剩余分期期限 -1、剩余金额 = 每期 × 剩余期数、记入收益-还款。
 * 打开应用时检查（跨过几个 10 号补几次），lastAuto 防止重复递减。 */
function checkAutoInstallment(){
  if (!UID) return;
  const today = new Date();
  let changed = false;
  const addIncomes = [];
  for (const d of DEBTS){
    if (!d.periods || !d.per || (d.leftPeriods||0) <= 0) continue;
    const from = d.lastAuto ? new Date(d.lastAuto) : (d.createdAt ? new Date(d.createdAt) : null);
    if (!from || isNaN(from)) continue;
    const n = countTenths(from, today);
    if (n <= 0) continue;
    const dec = Math.min(n, d.leftPeriods);
    for (let i=0; i<dec; i++){
      addIncomes.push({ id: nid(), date: tenthDate(from, i+1), cat: "还款", amount: r2(d.per), note: "10号自动 · " + d.platform });
    }
    d.leftPeriods = (d.leftPeriods||0) - dec;
    d.leftTotal = r2(d.per * d.leftPeriods);
    d.lastAuto = tenthDate(from, dec);
    changed = true;
  }
  if (changed){
    INCOMES = INCOMES.concat(addIncomes);
    saveDebts(); saveIncome();
    render();
    toast("分期已按每月10号自动更新，记入收益-还款");
  }
}
/* from（当天不计）之后、to（含）之前的每月 10 号个数 */
function countTenths(from, to){
  const start = new Date(from.getFullYear(), from.getMonth(), from.getDate()+1);
  const end   = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  if (start > end) return 0;
  let n = 0, y = start.getFullYear(), m = start.getMonth();
  const y1 = end.getFullYear(), m1 = end.getMonth();
  while (y < y1 || (y===y1 && m<=m1)){
    const t = new Date(y, m, 10);
    if (t >= start && t <= end) n++;
    m++; if (m>11){ m=0; y++; }
    if (y > y1) break;
  }
  return n;
}
/* from 之后的第 k 个 10 号（k≥1），返回 YYYY-MM-DD */
function tenthDate(from, k){
  let y = from.getFullYear(), m = from.getMonth(), count = 0;
  while (true){
    const t = new Date(y, m, 10);
    if (t > from){
      count++;
      if (count===k) return y+"-"+String(m+1).padStart(2,"0")+"-10";
    }
    m++; if (m>11){ m=0; y++; }
  }
}
function deleteDebt(id){
  const d = DEBTS.find(x=>x.id===id);
  if (!d) return;
  if (!confirm("确定删除「"+d.platform+"」这条欠款？")) return;
  DEBTS = DEBTS.filter(x=>x.id!==id);
  saveDebts();
  render();
  closeSheet();
  toast("已删除");
}
function payOne(id){
  const d = DEBTS.find(x=>x.id===id);
  if (!d) return;
  if (!d.periods){ toast("请先编辑设置分期，再每月还一期"); return; }
  if ((d.leftPeriods||0) <= 0){ toast("分期已还完，可编辑调整或删除"); return; }
  let amt = d.per!=null ? d.per : (d.total / d.periods);
  if ((d.leftTotal||0) - amt < 0) amt = num(d.leftTotal)||0;
  d.leftPeriods = d.leftPeriods - 1;
  d.leftTotal = r2(Math.max(0, (d.leftTotal||0) - amt));
  d.lastAuto = todayStr(); /* 手动还一期后，自动递减从下个 10 号起算，避免重复 */
  saveDebts();
  /* 同步记入收益-还款 */
  INCOMES.push({ id: nid(), date: todayStr(), cat: "还款", amount: r2(amt), note: "还一期 · " + d.platform });
  saveIncome();
  render();
  toast("已还一期 ¥"+(Math.round(amt*10)/10)+"，记入收益-还款");
}

/* ============================================================
 * 收益视图（存款 / 消费预留 / 还款）
 * ============================================================ */
const INC_CATS = [
  {c:"存款", cls:"dep"},
  {c:"消费预留", cls:"con"},
  {c:"还款", cls:"rep"}
];
function renderIncome(){
  const totals = INC_CATS.map(x=>({ c: x.c, cls: x.cls, v: r2(sum(INCOMES.filter(i=>i.cat===x.c).map(i=>i.amount))) }));
  const all = sum(totals.map(t=>t.v));
  const maxV = Math.max(...totals.map(t=>t.v), 1);
  /* 柱状图：存款 / 消费预留 / 还款，高度按金额比例，实时更新 */
  const bars = totals.map(t=>{
    const h = t.v>0 ? Math.max(14, Math.round(t.v/maxV*118)) : 4;
    return '<div class="barc">'+
      '<div class="bval">'+money(t.v)+'</div>'+
      '<div class="bwrap"><i class="b '+t.cls+'" style="height:'+h+'px"></i></div>'+
      '<div class="blab"><span class="bdot '+t.cls+'"></span>'+t.c+'</div>'+
      '</div>';
  }).join("");
  const rows = INCOMES.slice().sort((a,b)=> (b.date||"").localeCompare(a.date||"")).map(i=>{
    const x = INC_CATS.find(c=>c.c===i.cat) || {cls:"dep"};
    return '<div class="inc-row">'+
      '<span class="tag '+x.cls+'">'+esc(i.cat)+'</span>'+
      '<span class="date">'+esc(i.date)+'</span>'+
      '<span class="note">'+esc(i.note||"")+'</span>'+
      '<span class="amt" style="color:'+(i.cat==="还款"?"var(--chi)":"var(--ink)")+'">'+money(i.amount)+'</span>'+
      '<button class="x" onclick="openIncomeEdit(\''+i.id+'\')" aria-label="编辑">✎</button>'+
      '</div>';
  }).join("");
  view.innerHTML =
    '<div class="card" style="background:linear-gradient(135deg,#ffffff,#f0faf6)">'+
      '<h3>收益总览</h3>'+
      '<div class="big" style="font-size:30px">'+money(all)+'<small>累计</small></div>'+
      '<div class="hint">收益分三类记录：存款、消费预留、还款（还一期欠款会自动记入）。</div>'+
    '</div>'+
    '<div class="card"><h3>分类累计</h3><div class="inc-chart">'+bars+'</div></div>'+
    '<div class="card"><h3>收益明细</h3>'+
      (rows || '<div class="warn" style="margin-top:0">暂无记录，点下方按钮新增。</div>')+
    '</div>'+
    '<button class="btn-add" onclick="openIncomeEdit(null)">＋ 新增收益</button>'+
    '<div class="foot">收益记录保存在本机浏览器（右上角管理可导出）</div>';
  view.classList.remove("fade-in"); void view.offsetWidth; view.classList.add("fade-in");
}
function openIncomeEdit(id){
  const r = id ? INCOMES.find(x=>x.id===id) : null;
  const sel = INC_CATS.map(x=>'<option value="'+x.c+'"'+(r&&r.cat===x.c?" selected":"")+'>'+x.c+'</option>').join("");
  sheetEl.innerHTML =
    '<div class="grip"></div>'+
    '<div class="st">'+(r?'编辑收益':'新增收益')+'</div>'+
    '<div class="st-sub">分类：存款 / 消费预留 / 还款</div>'+
    '<div class="form-row"><label>分类</label><select id="ifCat">'+sel+'</select></div>'+
    '<div class="form-row"><label>金额（元）</label><input id="ifAmount" type="number" step="0.01" min="0" inputmode="decimal" value="'+(r?r.amount:"")+'"></div>'+
    '<div class="form-row"><label>日期</label><input id="ifDate" type="date" value="'+(r?esc(r.date):todayStr())+'"></div>'+
    '<div class="form-row"><label>备注</label><input id="ifNote" type="text" value="'+esc(r?r.note:"")+'" placeholder="选填"></div>'+
    '<button class="btn-close" onclick="saveIncomeForm(\''+(r?r.id:"")+'\')">保存</button>'+
    '<div class="btn-row">'+(r?'<button class="btn-ghost" onclick="deleteIncome(\''+r.id+'\')">删除</button>':'')+'<button class="btn-ghost" onclick="closeSheet()">取消</button></div>';
  sheetEl.classList.add("show");
  sheetMask.classList.add("show");
}
function saveIncomeForm(id){
  const cat = document.getElementById("ifCat").value;
  const amount = parseFloat(document.getElementById("ifAmount").value);
  const date = document.getElementById("ifDate").value;
  const note = document.getElementById("ifNote").value.trim();
  if (!(amount>0) || isNaN(amount)){ toast("请输入有效金额"); return; }
  if (!date){ toast("请选择日期"); return; }
  const rec = { cat, amount: r2(amount), date, note };
  if (id){
    const r = INCOMES.find(x=>x.id===id);
    if (r) Object.assign(r, rec);
  } else {
    rec.id = nid();
    INCOMES.push(rec);
  }
  saveIncome();
  render();
  closeSheet();
  toast(id?"已保存":"已新增");
}
function deleteIncome(id){
  if (!confirm("确定删除这条收益记录？")) return;
  INCOMES = INCOMES.filter(x=>x.id!==id);
  saveIncome();
  render();
  closeSheet();
  toast("已删除");
}

/* ============================================================
 * 工资规则说明
 * ============================================================ */
function renderRules(){
  const item = (n, t)=> '<div class="rule-item"><span class="rk">'+n+'</span><span class="rt">'+t+'</span></div>';
  view.innerHTML =
    '<div class="card"><h3>考勤与工资计算规则</h3>'+
      item("1","<b>每月工资</b>：月薪 ÷ 当月天数 = 日薪。月薪可自定义：点月度页工资卡 ✎ 单独设置本月，右上角管理可改默认值。")+
      item("2","<b>每天工时（季节制）</b>：5月1日—11月30日 每天 8小时30分钟；12月1日—次年4月30日 每天 8小时。时薪 = 日薪 ÷ 每天工时。")+
      item("3","<b>加班费</b>：加班小时 × 时薪。加班按天记录（点日期填加班小时数）。")+
      item("4","<b>休班额度（30天月）</b>：当月30天可休 2 天不扣钱（<b>放假也算休班</b>，两者合计）。<div class=\"ex\">休 0 天（2天都没休）→ 额外多发 1 天工资，剩余 2 天积攒到下月；<br>休 1 天 → 不扣钱，剩余 1 天积攒到下月；<br>休 2 天 → 刚好额度，不奖不扣；<br>超过 2 天 → 每超 1 天扣 1 天工资。</div>")+
      item("5","<b>休班额度（31天月）</b>：当月31天可休 3 天不扣钱（<b>放假也算休班</b>，两者合计）。<div class=\"ex\">休 1 天 → 剩余 2 天：其中 1 天叠加到下个月（积攒），另外 1 天如果上班就多发 1 天工资、如果休班也不扣工资；<br>休 2 天 → 剩余 1 天：如果上班就多发 1 天工资、如果休班也不扣工资，<b>不叠加到下月</b>；<br>休 3 天 → 刚好额度，不奖不扣；<br>休 0 天 → 按少休同样多发 1 天工资（可调整）；<br>超过 3 天 → 每超 1 天扣 1 天工资。</div>")+
      item("6","<b>积攒结转</b>：当月没休完的额度自动积攒到下月；下月休息先抵扣积攒天数（<b>延长休息不算工资</b>，不奖也不扣）。积攒跨年继续有效。")+
      item("7","<b>2月特殊</b>：做几天发几天 —— 工资 = 日薪 × 实际出勤天数（班/加班按半天计）＋ 加班费，不参与休班额度与积攒。")+
      item("8","<b>无考勤记录</b>：本月未记录任何考勤时，工资按源表预填值显示或待录入后计算；录入后自动按以上规则重算。")+
      item("9","<b>放假 / 迟到</b>：放假与休班一样计入休班额度（30天月共 2 天、31天月共 3 天）；迟到只记录，不影响工资（可按需调整）。")+
    '</div>'+
    '<div class="card"><h3>示例</h3>'+
      item("例","<b>30天月</b>：月薪3000 → 日薪100.00。本月休1天：工资3000（不扣），剩余1天积攒。<div class=\"ex\">下月（31天）休2天：先抵扣积攒1天，实际少休1天 → 多发1天工资。</div>")+
      item("例","<b>31天月</b>：月薪3000 → 日薪96.77。本月休1天 → 多发1天工资（+96.77），剩余2天积攒。")+
      item("例","<b>加班</b>：夏季（8.5小时/天）时薪 = 96.77 ÷ 8.5 ≈ 11.38 元/小时，加班 5 小时 → +56.90 元。")+
    '</div>'+
    '<div class="foot">规则有出入时告诉我，我随时调整算法</div>';
  view.classList.remove("fade-in"); void view.offsetWidth; view.classList.add("fade-in");
}
function convCalc(){
  const h  = parseFloat(document.getElementById("cvH").value) || 0;
  const m  = parseFloat(document.getElementById("cvM").value) || 0;
  const s  = parseFloat(document.getElementById("cvS").value) || 0;
  const total = h + m/60 + s/3600;
  const v = Math.round(total*100)/100;
  document.getElementById("cvOut").textContent = String(v);
}
function copyCv(){
  const v = document.getElementById("cvOut").textContent;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(()=>toast("已复制 "+v+" 小时")).catch(()=>toast("复制失败，请手动记下"));
  } else {
    toast("已算出 "+v+" 小时");
  }
}

/* ===== 启动 ===== */
initUid();
loadAllData();
renderPersonSwitch();
route();
if (UID){ loadFromServer(); checkAutoInstallment(); } else openPinGate();
